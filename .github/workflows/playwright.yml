name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  BASE_URL: ${{ vars.BASE_URL || 'https://esignpro.net' }}
  ESIGN_NAME: ${{ secrets.ESIGN_NAME }}
  ESIGN_COMPANY: ${{ secrets.ESIGN_COMPANY }}
  ESIGN_EMAIL: ${{ secrets.ESIGN_EMAIL }}
  ESIGN_PASSWORD: ${{ secrets.ESIGN_PASSWORD }}
  ESIGN_COMPANY_TYPE: ${{ vars.ESIGN_COMPANY_TYPE || 'Other' }}
  ESIGN_COMPANY_SIZE: ${{ vars.ESIGN_COMPANY_SIZE || '1–50' }}
  AUTH_STATE_PATH: auth/storageState.json
  # The RUN_* opt-in flags were removed (18 Nov 2026): no case is skipped. CI runs the
  # `chromium` + `chromium-builder` projects only. The `chromium-account` project (Stripe
  # test-mode payments, uploads, sign-in/sign-out, performance) is NOT run here: it needs the
  # CARD_* secrets, changes the live billing plan, and ends the account's single session.
  # Run it locally with `npm run test:all`. Note: the signup test (tests/auth/signup.spec.ts)
  # does run on CI and registers one unverified qa.signup+<time>@example.com workspace per run.
  # The automatic qa-reports/ regeneration is disabled on CI (reporters/qa-reports-reporter.ts).
  # Known-bug checks are wrapped in test.fail(): the job stays green while a reported
  # defect is still open and turns red when one is fixed (promote it to a normal test).
  KNOWN_BUGS: expect-fail
  DASHBOARD_OPEN: never

jobs:
  chromium:
    name: Chromium — smoke on PR, full otherwise
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Restore authenticated session
        env:
          AUTH_STORAGE_STATE_B64: ${{ secrets.AUTH_STORAGE_STATE_B64 }}
        run: |
          mkdir -p auth
          if [ -n "$AUTH_STORAGE_STATE_B64" ]; then
            printf '%s' "$AUTH_STORAGE_STATE_B64" | base64 -d > auth/storageState.json
            echo "Session restored ($(wc -c < auth/storageState.json) bytes)."
          else
            echo "::warning title=Missing session::AUTH_STORAGE_STATE_B64 is not set; authenticated specs will fail."
          fi

      - name: Refresh session (trusted device, no OTP)
        run: |
          set +e
          npx tsx scripts/refresh-auth.ts
          code=$?
          if [ "$code" = "2" ]; then
            echo "::warning title=Session::Device no longer trusted — run 'npm run auth:save' locally and update AUTH_STORAGE_STATE_B64."
          elif [ "$code" != "0" ]; then
            echo "::warning title=Session::Session refresh failed (exit $code)."
          fi
          exit 0

      - name: Type check
        run: npm run typecheck

      - name: Smoke suite (pull requests)
        if: github.event_name == 'pull_request'
        run: npx playwright test --project=chromium --project=chromium-builder --grep @smoke --grep-invert "@data|@bug"

      # Functional + UI + flows + known-bug checks. @data cases write to the live
      # workspace (folders, contacts, templates) and stay local/manual (TEST_PLAN R13).
      - name: Full suite (main, nightly, manual)
        if: github.event_name != 'pull_request'
        run: npx playwright test --project=chromium --project=chromium-builder --grep-invert "@data|@perf"

      # Artifacts show the signed-in workspace and traces carry session cookies.
      # The repository is public, so keep retention short (see TEST_PLAN §14).
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-dashboard-chromium
          path: dashboard-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results (JUnit, traces, video, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-chromium
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Playwright — Chromium"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\` on \`${{ github.ref_name }}\`"
            echo "- Dashboard: \`test-dashboard-chromium\` artifact (open \`index.html\`)"
            echo "- Report: \`playwright-report-chromium\` artifact"
            echo "- Results: \`test-results-chromium\` artifact (JUnit + traces)"
            if [ -f dashboard-report/last-run.json ]; then
              node -e "const r=require('./dashboard-report/last-run.json');const t=r.totals;console.log('');console.log('| Total | Passed | Failed | Flaky | Skipped | Pass rate | Known bugs reproduced |');console.log('|---:|---:|---:|---:|---:|---:|---:|');console.log('| '+[t.total,t.passed,t.failed,t.flaky,t.skipped,(r.passRate*100).toFixed(1)+'%',r.bugsOpen].join(' | ')+' |')"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The test account allows ONE active session (FEATURES O12): jobs that sign in must
  # not overlap, or they sign each other out. Run after Chromium, one browser at a time.
  cross-browser:
    name: ${{ matrix.browser }} — smoke (schedule / manual)
    needs: chromium
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        browser: [firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium too: scripts/refresh-auth.ts signs in with Chromium whatever the matrix
      # browser. Without it the refresh crashed, the stale session (already superseded by
      # the Chromium job's sign-in) was used, and every authenticated smoke test failed.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium ${{ matrix.browser }}

      - name: Restore authenticated session
        env:
          AUTH_STORAGE_STATE_B64: ${{ secrets.AUTH_STORAGE_STATE_B64 }}
        run: |
          mkdir -p auth
          if [ -n "$AUTH_STORAGE_STATE_B64" ]; then
            printf '%s' "$AUTH_STORAGE_STATE_B64" | base64 -d > auth/storageState.json
          else
            echo "::warning title=Missing session::AUTH_STORAGE_STATE_B64 is not set."
          fi

      # Fail fast: without a live session every authenticated test fails anyway.
      - name: Refresh session (trusted device, no OTP)
        run: |
          npx tsx scripts/refresh-auth.ts || {
            echo "::error title=Session::Session refresh failed — authenticated tests cannot run. If OTP is required, run 'npm run auth:save' locally and update AUTH_STORAGE_STATE_B64."
            exit 1
          }

      - name: Smoke suite
        run: npx playwright test --project=${{ matrix.browser }} --grep @smoke --grep-invert "@data|@bug"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
